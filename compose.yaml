services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: roomcraft
      POSTGRES_USER: roomcraft
      POSTGRES_PASSWORD: roomcraft
    ports:
      - "5432:5432"
    volumes:
      - roomcraft-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomcraft -d roomcraft"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  roomcraft-postgres:
