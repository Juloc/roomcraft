name: Release

on:
  pull_request:
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/release.yml
      - apps/web/**
      - packages/**
      - package.json
      - src/server/RoomCraft.Host/**
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Container version without the v prefix
        required: true
        default: 0.1.0-alpha.3

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/juloc/roomcraft
  VERSION: ${{ inputs.version || '0.1.0-alpha.3' }}

jobs:
  release:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --tag "$IMAGE_NAME:$VERSION" \
            --tag "$IMAGE_NAME:edge" \
            .

      - name: Smoke test image
        run: |
          volume_name="roomcraft-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_id=""
          cleanup() {
            if [ -n "$container_id" ]; then
              docker rm -f "$container_id" >/dev/null 2>&1 || true
            fi
            docker volume rm -f "$volume_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker volume create "$volume_name" >/dev/null

          start_roomcraft() {
            container_id="$(docker run -d -p 18080:8080 -v "$volume_name:/data" "$IMAGE_NAME:$VERSION")"
            ready=0
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then
                ready=1
                break
              fi
              if ! docker inspect -f '{{.State.Running}}' "$container_id" | grep -q true; then
                break
              fi
              sleep 1
            done

            if [ "$ready" -ne 1 ]; then
              docker logs "$container_id"
              exit 1
            fi

            curl --fail --silent http://127.0.0.1:18080/ | grep -q '<div id="root"'
          }

          start_roomcraft
          docker rm -f "$container_id" >/dev/null
          container_id=""

          docker run --rm -v "$volume_name:/data" alpine:3.22 chmod 0777 /data/postgres

          start_roomcraft

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE_NAME:$VERSION"
          docker push "$IMAGE_NAME:edge"

      - name: Create GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "RoomCraft $VERSION" \
            --generate-notes
