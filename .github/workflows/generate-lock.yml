name: Generate npm lockfile

on:
  push:
    branches:
      - chatgpt/selection-manipulation-40
    paths:
      - .github/workflows/generate-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/selection-manipulation-40
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@12.1.0
      - name: Generate lockfile
        run: npm install --package-lock-only
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Lock frontend dependencies"
          git push origin HEAD:chatgpt/selection-manipulation-40
